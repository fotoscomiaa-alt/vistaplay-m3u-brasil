name: Atualizar playlist M3U autorizada

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gerar lista e status
        run: python3 automation/update_playlist.py
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/lista.m3u automation/status.json
          git diff --cached --quiet || git commit -m "chore: atualizar playlist autorizada"
          git push
